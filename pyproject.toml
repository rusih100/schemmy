[project]
name = "schemmy"
version = "0.1.0"
description = "Validate data with plain type annotations. No dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ruslan Glotov" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["validation", "schema", "type-hints", "annotations", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/rusih100/schemmy"
Issues = "https://github.com/rusih100/schemmy/issues"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.88",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "Q",   # flake8-quotes
    "UP",  # pyupgrade
    "C",   # flake8-comprehensions + mccabe
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "ISC", # flake8-implicit-str-concat
    "T20", # print and pprint
    "ANN", # flake8-annotations
    "TC",  # flake8-type-checking
    "PT",  # flake8-pytest-style
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line length is handled by ruff format
    "ANN401", # Any is allowed: schemas accept arbitrary values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = ["schemmy"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ty.terminal]
error-on-warning = true

# Tests pass invalid data on purpose.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
missing-argument = "ignore"
unknown-argument = "ignore"
